# Configuration for the slf4j-simple binding pulled in transitively (e.g. by HikariCP).
# See https://www.slf4j.org/api/org/slf4j/simple/SimpleLogger.html for all keys.

org.slf4j.simpleLogger.defaultLogLevel=info

# Example layout tweak: "14:32:01.123 [INFO] message" instead of "[main] INFO name - message".
org.slf4j.simpleLogger.showDateTime=false
org.slf4j.simpleLogger.levelInBrackets=true
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showLogName=false

# Silence HikariCP's connection pool lifecycle logging (pool start/stop, connection add).
org.slf4j.simpleLogger.log.com.zaxxer.hikari=off
